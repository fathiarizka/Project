<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin - KOSKU</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <aside class="sidebar">
            <h2>KOSKU</h2>
            <a href="admin-dashboard.html" class="active">Dashboard</a>
            <a href="admin-kamar.html">Data Kamar</a>
            <a href="admin-penghuni.html">Data Penghuni</a>
            <a href="admin-pembayaran.html">Pembayaran</a>
            <a href="admin-laporan.html">Laporan</a>
            <a href="index.html">Logout</a>

        <main class="main-content">
            <h1>Dashboard Admin</h1>
            <div class="cards">
                <div class="card"><h3>Total Kamar</h3><p class="harga">15</p></div>
                <div class="card"><h3>Kamar Terisi</h3><p class="harga" style="color:#27ae60;">10</p></div>
                <div class="card"><h3>Kamar Kosong</h3><p class="harga" style="color:#e67e22;">5</p></div>
                <div class="card"><h3>Total Penghuni</h3><p class="harga">10</p></div>
            </div>

            <div class="cards">
                <div class="card">
                    <h3>Grafik Pendapatan Bulanan</h3>
                    <p style="font-size:15px; color:#555; margin-top:15px;">Jan: Rp 2jt | Feb: Rp 2,5jt | Mar: Rp 3jt | Apr: Rp 3jt</p>
                </div>
                <div class="card">
                    <h3>Status Kamar</h3>
                    <p class="harga" style="color:#27ae60;">67% Terisi</p>
                    <small>33% Kosong</small>
                </div>
            </div>
        </main>
    </div>

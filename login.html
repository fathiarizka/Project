<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KOSKU</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2>Selamat Datang</h2>
            <p class="subtitle">Masuk untuk melanjutkan ke Sistem KOSKU</p>
            
            <form onsubmit="prosesLogin(event)">
                <div class="form-group">
                    <label for="username">Username atau Email</label>
                    <input type="text" id="username" placeholder="Masukkan username (admin / penghuni)" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn-primary btn-full">Login</button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: #3498db; text-decoration: none; font-size: 14px;">← Kembali ke Beranda</a>
            </div>
        </div>
    </div>

    <script>
        function prosesLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.toLowerCase();
            
            if (user === 'admin') {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'penghuni-dashboard.html';
            }
        }
    </script>
</body>
</html>
